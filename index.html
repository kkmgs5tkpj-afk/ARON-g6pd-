<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#073b4c">

<title>G6PD-ARON</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef5f7;
    color: #172a2f;
}

header {
    background: #064b5c;
    color: white;
    padding: 35px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 34px;
}

header p {
    margin-top: 8px;
}

.container {
    max-width: 800px;
    margin: 30px auto;
    padding: 20px;
}

.search {
    display: flex;
    gap: 10px;
}

#input {
    flex: 1;
    padding: 15px;
    font-size: 16px;
    border: 2px solid #c9dfe5;
    border-radius: 10px;
    background: white;
    color: #172a2f;
    outline: none;
}

input:focus {
    border-color: #118ab2;
}
}

button {
    padding: 15px 22px;
    background: #118ab2;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

#result {
    margin-top: 20px;
    display: none;
}

.drug-card {
    background: white;
    padding: 20px;
    margin-bottom: 12px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.drug-name {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 10px;
}

.high {
    color: #b00020;
}

.moderate {
    color: #9a6500;
}

.safe {
    color: #137333;
}

.status {
    font-weight: bold;
    margin: 8px 0;
}

.aliases {
    color: #666;
    font-size: 14px;
}

.not-found {
    background: white;
    padding: 20px;
    border-radius: 12px;
}
.drug-card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-top: 15px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    border-left: 5px solid #118ab2;
}

.drug-name {
    color: #064b5c;
}

.high {
    color: #b00020;
    font-weight: bold;
}

.moderate {
    color: #d17b00;
    font-weight: bold;
}

.safe {
    color: #137333;
    font-weight: bold;
}

.status {
    color: #555;
}
</style>

</head>


<body>

<header>

<h1>G6PD-ARON</h1>

<p>G6PD Drug Safety Checker</p>

</header>


<div class="container">

<div class="search">

<input
    id="searchInput"
    type="text"
    placeholder="Search medication..."
    autocomplete="off"
>

<button onclick="searchDrug()">
    Search
</button>

</div>


<div id="result"></div>

</div>


<script>

let drugs = [];


// ================================
// LOAD DATABASE
// ================================

fetch("data/drugs.json")

.then(response => {

    if (!response.ok) {
        throw new Error("Database could not be loaded");
    }

    return response.json();

})

.then(data => {

    drugs = data;

    console.log(
        "Database loaded:",
        drugs.length,
        "drugs"
    );

})

.catch(error => {

    console.error(
        "Database error:",
        error
    );

});


// ================================
// NORMALIZE TEXT
// ================================

function normalize(text) {

    return String(text || "")
        .toLowerCase()
        .trim()
        .replace(/[-_]/g, " ")
        .replace(/\s+/g, " ");

}


// ================================
// SEARCH
// ================================

function searchDrug() {

    const input = normalize(
        document.getElementById("searchInput").value
    );

    const result =
        document.getElementById("result");


    // Empty search

    if (input === "") {

        result.style.display = "none";

        result.innerHTML = "";

        return;

    }


    // ================================
    // PARTIAL SEARCH
    // ================================

    const matches = drugs.filter(drug => {

        const name =
            normalize(drug.name);


        // Search in drug name

        if (name.includes(input)) {

            return true;

        }


        // Search in aliases

        if (Array.isArray(drug.aliases)) {

            return drug.aliases.some(alias =>

                normalize(alias).includes(input)

            );

        }


        return false;

    });


    // ================================
    // NO RESULTS
    // ================================

    if (matches.length === 0) {

        result.style.display = "block";

        result.innerHTML = `

            <div class="not-found">

                <h3>Drug not found</h3>

                <p>
                    No medication matching
                    "<strong>${input}</strong>"
                    was found.
                </p>

            </div>

        `;

        return;

    }


    // ================================
    // DISPLAY RESULTS
    // ================================

    result.style.display = "block";


    result.innerHTML = matches
        .slice(0, 20)
        .map(drug => {


            let riskText = "";

            let riskClass = "";


            if (drug.category === "HIGH") {

                riskText = "🔴 HIGH RISK";

                riskClass = "high";

            }

            else if (drug.category === "MODERATE") {

                riskText = "🟠 MODERATE RISK";

                riskClass = "moderate";

            }

            else {

                riskText = "🟢 RELATIVELY SAFE";

                riskClass = "safe";

            }


            let aliasesHTML = "";


            if (
                Array.isArray(drug.aliases) &&
                drug.aliases.length > 0
            ) {

                aliasesHTML = `

                    <div class="aliases">

                        Also known as:
                        ${drug.aliases.join(", ")}

                    </div>

                `;

            }


            return `

                <div class="drug-card">

                    <div class="drug-name">

                        ${drug.name}

                    </div>


                    <div class="${riskClass}">

                        ${riskText}

                    </div>


                    <div class="status">

                        ${drug.status || ""}

                    </div>


                    ${aliasesHTML}


                    ${
                        drug.notes
                        ? `<p>${drug.notes}</p>`
                        : ""
                    }

                </div>

            `;

        })
        .join("");

}


// ================================
// ENTER KEY
// ================================

document
    .getElementById("searchInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            searchDrug();

        }

    });

</script>


</body>

</html>
