<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G6PD-ARON</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef5f7;
    color: #172a2f;
}

header {
    background: linear-gradient(135deg, #064b5c, #087e8b);
    color: white;
    text-align: center;
    padding: 35px 20px;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

.container {
    max-width: 800px;
    margin: 25px auto;
    padding: 20px;
}

.search {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 15px;
    border: 2px solid #c9dfe5;
    border-radius: 12px;
    font-size: 16px;
}

button {
    padding: 15px 22px;
    background: #118ab2;
    color: white;
    border: none;
    border-radius: 12px;
    font-weight: bold;
}

#result {
    margin-top: 20px;
}

.drug-card,
.family-card {
    background: white;
    padding: 18px;
    margin-bottom: 12px;
    border-radius: 14px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.drug-name {
    font-size: 21px;
    font-weight: bold;
    color: #064b5c;
}

.high {
    color: #b00020;
    font-weight: bold;
}

.moderate {
    color: #d17b00;
    font-weight: bold;
}

.safe {
    color: #137333;
    font-weight: bold;
}

.family-title {
    font-size: 18px;
    font-weight: bold;
    color: #064b5c;
}

.family-drugs {
    margin-top: 10px;
    color: #555;
}

h2 {
    color: #064b5c;
}

</style>

</head>

<body>

<header>

<h1>G6PD-ARON</h1>
<p>G6PD Drug Safety Checker</p>

</header>


<div class="container">

<!-- SEARCH -->

<div class="search">

<input
id="searchInput"
type="text"
placeholder="Search medication..."
>

<button onclick="searchDrug()">
Search
</button>

</div>


<div id="result"></div>


<!-- DRUG FAMILIES -->

<h2>Drug Families</h2>

<div id="families"></div>

</div>


<script>

let drugs = [];


/* LOAD DATABASE */

fetch("data/drugs.json")

.then(response => response.json())

.then(data => {

    drugs = data;

    showFamilies();

})

.catch(error => {

    console.log("Database error:", error);

});


/* NORMALIZE */

function normalize(text) {

    return String(text || "")
        .toLowerCase()
        .trim();

}


/* SEARCH */

function searchDrug() {

    const input =
        normalize(
            document.getElementById("searchInput").value
        );

    const result =
        document.getElementById("result");


    if (input === "") {

        result.innerHTML = "";

        return;

    }


    const matches = drugs.filter(drug => {

        if (
            normalize(drug.name)
            .includes(input)
        ) {
            return true;
        }


        if (Array.isArray(drug.aliases)) {

            return drug.aliases.some(alias =>
                normalize(alias).includes(input)
            );

        }

        return false;

    });


    if (matches.length === 0) {

        result.innerHTML = `
            <div class="drug-card">
                <h3>Drug not found</h3>
            </div>
        `;

        return;

    }


    result.innerHTML = matches
        .slice(0, 20)
        .map(drug => {

            let risk = "";
            let className = "";

            if (drug.category === "HIGH") {

                risk = "🔴 HIGH RISK";
                className = "high";

            }

            else if (drug.category === "MODERATE") {

                risk = "🟠 MODERATE RISK";
                className = "moderate";

            }

            else if (drug.category === "SAFE") {

                risk = "🟢 RELATIVELY SAFE";
                className = "safe";

            }


            return `

                <div class="drug-card">

                    <div class="drug-name">
                        ${drug.name}
                    </div>

                    <p class="${className}">
                        ${risk}
                    </p>

                    <p>
                        <strong>
                            ${drug.status || ""}
                        </strong>
                    </p>

                    <p>
                        Family:
                        <strong>
                            ${drug.family || "Not specified"}
                        </strong>
                    </p>

                    ${
                        drug.aliases &&
                        drug.aliases.length
                        ?
                        `<p>
                            Also known as:
                            ${drug.aliases.join(", ")}
                        </p>`
                        :
                        ""
                    }

                </div>

            `;

        })
        .join("");

}


/* DRUG FAMILIES */

function showFamilies() {

    const families = {};


    drugs.forEach(drug => {

        const family =
            drug.family || "Other";


        if (!families[family]) {

            families[family] = [];

        }

        families[family].push(drug);

    });


    const container =
        document.getElementById("families");


    container.innerHTML =
        Object.keys(families)
        .sort()
        .map(family => {

            return `

                <div class="family-card">

                    <div class="family-title">
                        ${family}
                    </div>

                    <div class="family-drugs">

                        ${families[family]
                            .map(drug => drug.name)
                            .join(", ")
                        }

                    </div>

                </div>

            `;

        })
        .join("");

}


/* ENTER KEY */

document
.getElementById("searchInput")
.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        searchDrug();

    }

});

</script>

</body>
</html>
