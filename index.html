<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G6PD-ARON</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f9;
        }

        header {
            background: #073b4c;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
        }

        .search {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 15px;
            font-size: 16px;
        }

        button {
            padding: 15px 20px;
            background: #073b4c;
            color: white;
            border: none;
        }

        #result {
            margin-top: 20px;
            padding: 20px;
            background: white;
            display: none;
        }
    </style>
</head>

<body>

<header>
    <h1>G6PD-ARON</h1>
    <p>G6PD Drug Safety Checker</p>
</header>

<div class="container">

    <div class="search">
        <input id="searchInput" placeholder="Search medication...">
        <button onclick="searchDrug()">Search</button>
    </div>

    <div id="result"></div>

</div>

<script>

let drugs = [];

fetch("data/drugs.json")
    .then(response => response.json())
    .then(data => {
        drugs = data;
        console.log("Database loaded:", drugs.length);
    })
    .catch(error => {
        console.error("Database error:", error);
    });


function searchDrug() {

    const input = document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    const result =
        document.getElementById("result");

    if (input === "") {
        result.style.display = "none";
        return;
    }

    const matches = drugs.filter(drug => {

        const name =
            String(drug.name || "").toLowerCase();

        const aliases =
            Array.isArray(drug.aliases)
                ? drug.aliases
                : [];

        // البحث الجزئي داخل اسم الدواء
        const nameMatch =
            name.includes(input);

        // البحث الجزئي داخل الأسماء البديلة
        const aliasMatch =
            aliases.some(alias =>
                String(alias)
                    .toLowerCase()
                    .includes(input)
            );

        return nameMatch || aliasMatch;

    });


    result.style.display = "block";


    if (matches.length === 0) {

        result.innerHTML = `
            <h3>Drug not found</h3>
            <p>
                No medication matching
                "<strong>${input}</strong>"
                was found.
            </p>
        `;

        return;
    }


    result.innerHTML = matches
        .slice(0, 20)
        .map(drug => {

            let riskText;
            let riskClass;

            if (drug.category === "HIGH") {

                riskText = "🔴 HIGH RISK";
                riskClass = "high";

            } else if (drug.category === "MODERATE") {

                riskText = "🟠 MODERATE RISK";
                riskClass = "moderate";

            } else {

                riskText = "🟢 RELATIVELY SAFE";
                riskClass = "safe";

            }


            return `
                <div class="drug-result">

                    <div class="drug-name">
                        ${drug.name}
                    </div>

                    <div class="risk ${riskClass}">
                        ${riskText}
                    </div>

                    <div class="status">
                        ${drug.status || ""}
                    </div>

                    <div class="notes">
                        ${drug.notes || ""}
                    </div>

                </div>
            `;

        })
        .join("");

}


    // البحث الجزئي داخل الاسم والـ aliases
    const matches = drugs.filter(item => {

        const name =
            String(item.name || "").toLowerCase();

        const aliases =
            Array.isArray(item.aliases)
                ? item.aliases
                : [];


        // الاسم الرئيسي
        if (name.includes(input)) {
            return true;
        }


        // الأسماء البديلة
        return aliases.some(alias =>
            String(alias)
                .toLowerCase()
                .includes(input)
        );

    });


    result.style.display = "block";


    // لا توجد نتائج
    if (matches.length === 0) {

        result.innerHTML = `
            <h3>Drug not found</h3>
            <p>No medication matching "${input}" was found.</p>
        `;

        return;
    }


    // عرض كل النتائج
    result.innerHTML = matches
        .slice(0, 20)
        .map(drug => {

            let risk = "";

            if (drug.category === "HIGH") {

                risk = "🔴 HIGH RISK";

            } else if (drug.category === "MODERATE") {

                risk = "🟠 MODERATE RISK";

            } else {

                risk = "🟢 RELATIVELY SAFE";

            }


            return `
                <div style="
                    padding:15px;
                    margin-bottom:10px;
                    border-bottom:1px solid #ddd;
                ">

                    <h2 style="margin:0 0 8px 0;">
                        ${drug.name}
                    </h2>

                    <h3 style="margin:5px 0;">
                        ${risk}
                    </h3>

                    <p>
                        <strong>
                            ${drug.status || ""}
                        </strong>
                    </p>

                    <p>
                        ${drug.notes || ""}
                    </p>

                </div>
            `;

        })
        .join("");

}


    const drug = drugs.find(item => {

    const name = String(item.name || "").toLowerCase();

    if (name.includes(input)) {
        return true;
    }

    if (Array.isArray(item.aliases)) {

        return item.aliases.some(alias =>
            String(alias || "").toLowerCase().includes(input)
        );

    }

    return false;

});

        // البحث الجزئي بالأسماء البديلة
        if (item.aliases) {

            return item.aliases.some(alias =>
                alias.toLowerCase().includes(input)
            );

        }


        return false;

    });


    result.style.display = "block";


    if (!drug) {

        result.innerHTML =
            "<h3>Drug not found</h3>";

        return;

    }


    let risk = "";


    if (drug.category === "HIGH") {

        risk = "🔴 HIGH RISK";

    }

    else if (drug.category === "MODERATE") {

        risk = "🟠 MODERATE RISK";

    }

    else {

        risk = "🟢 RELATIVELY SAFE";

    }


    result.innerHTML = `
        <h2>${drug.name}</h2>

        <h3>${risk}</h3>

        <p>
            <strong>${drug.status}</strong>
        </p>

        <p>
            ${drug.notes || ""}
        </p>
    `;

}


    const drug = drugs.find(item => {

        if (item.name.toLowerCase() === input) {
            return true;
        }

        if (item.aliases) {

            return item.aliases.some(alias =>
                alias.toLowerCase() === input
            );

        }

        return false;

    });


    result.style.display = "block";


    if (!drug) {

        result.innerHTML =
            "<h3>Drug not found</h3>";

        return;

    }


    let risk = "";

    if (drug.category === "HIGH") {

        risk = "🔴 HIGH RISK";

    } else if (drug.category === "MODERATE") {

        risk = "🟠 MODERATE RISK";

    } else {

        risk = "🟢 RELATIVELY SAFE";

    }


    result.innerHTML = `
        <h2>${drug.name}</h2>
        <h3>${risk}</h3>
        <p><strong>${drug.status}</strong></p>
        <p>${drug.notes || ""}</p>
    `;

}

</script>

</body>
</html>
