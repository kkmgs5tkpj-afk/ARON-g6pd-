<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G6PD-ARON</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f9;
        }

        header {
            background: #073b4c;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
        }

        .search {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 15px;
            font-size: 16px;
        }

        button {
            padding: 15px 20px;
            background: #073b4c;
            color: white;
            border: none;
        }

        #result {
            margin-top: 20px;
            padding: 20px;
            background: white;
            display: none;
        }
    </style>
</head>

<body>

<header>
    <h1>G6PD-ARON</h1>
    <p>G6PD Drug Safety Checker</p>
</header>

<div class="container">

    <div class="search">
        <input id="searchInput" placeholder="Search medication...">
        <button onclick="searchDrug()">Search</button>
    </div>

    <div id="result"></div>

</div>

<script>

let drugs = [];

fetch("data/drugs.json")
    .then(response => response.json())
    .then(data => {
        drugs = data;
        console.log("Database loaded:", drugs.length);
    })
    .catch(error => {
        console.error("Database error:", error);
    });


function searchDrug() {

    const input =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    const result =
        document.getElementById("result");


    if (!input) {

        result.style.display = "none";

        return;

    }


    const drug = drugs.find(item => {

        const name =
            item.name.toLowerCase();


        // البحث الجزئي بالاسم
        if (name.includes(input)) {

            return true;

        }


        // البحث الجزئي بالأسماء البديلة
        if (item.aliases) {

            return item.aliases.some(alias =>
                alias.toLowerCase().includes(input)
            );

        }


        return false;

    });


    result.style.display = "block";


    if (!drug) {

        result.innerHTML =
            "<h3>Drug not found</h3>";

        return;

    }


    let risk = "";


    if (drug.category === "HIGH") {

        risk = "🔴 HIGH RISK";

    }

    else if (drug.category === "MODERATE") {

        risk = "🟠 MODERATE RISK";

    }

    else {

        risk = "🟢 RELATIVELY SAFE";

    }


    result.innerHTML = `
        <h2>${drug.name}</h2>

        <h3>${risk}</h3>

        <p>
            <strong>${drug.status}</strong>
        </p>

        <p>
            ${drug.notes || ""}
        </p>
    `;

}


    const drug = drugs.find(item => {

        if (item.name.toLowerCase() === input) {
            return true;
        }

        if (item.aliases) {

            return item.aliases.some(alias =>
                alias.toLowerCase() === input
            );

        }

        return false;

    });


    result.style.display = "block";


    if (!drug) {

        result.innerHTML =
            "<h3>Drug not found</h3>";

        return;

    }


    let risk = "";

    if (drug.category === "HIGH") {

        risk = "🔴 HIGH RISK";

    } else if (drug.category === "MODERATE") {

        risk = "🟠 MODERATE RISK";

    } else {

        risk = "🟢 RELATIVELY SAFE";

    }


    result.innerHTML = `
        <h2>${drug.name}</h2>
        <h3>${risk}</h3>
        <p><strong>${drug.status}</strong></p>
        <p>${drug.notes || ""}</p>
    `;

}

</script>

</body>
</html>
